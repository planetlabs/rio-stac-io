name: Set up Pixi
description: |
  Single source of truth for the pinned `pixi` (and `prefix-dev/setup-pixi`)
  version used by every workflow in this repo. Update both versions here.

inputs:
  run-install:
    description: Whether `prefix-dev/setup-pixi` should run `pixi install`.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Pixi
      uses: prefix-dev/setup-pixi@v0.9.3
      with:
        pixi-version: v0.67.2
        run-install: ${{ inputs.run-install }}
