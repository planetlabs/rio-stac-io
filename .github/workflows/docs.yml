name: Docs

env:
  PIXI_LOCKED: true

on:
  push:
    branches:
      - main

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.52.0 # Pin to a specific version for stability
        with:
          cache: true # Enable caching of the Pixi environment
      - uses: actions/checkout@v5
      - run: pixi run -e docs deploy
