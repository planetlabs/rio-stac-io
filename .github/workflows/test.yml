name: Test


env:
  PIXI_LOCKED: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python -m pip install --upgrade pip
      - run: pip install pre-commit ruff mypy types-python-dateutil types-pytz types-requests
      - run: pre-commit install
      - run: pre-commit run --all-files

  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/prefix-dev/pixi:0.52.0
    strategy:
      matrix:
        gdal: [gdal38, gdal39, gdal310, gdal311]
        stac_version: ["1.0.0", "1.1.0"]
    steps:
      - run: apt-get update && apt-get install -y build-essential git curl jq
      - uses: actions/checkout@v5
      - run: pixi run -e dev-${{ matrix.gdal }} test
        env:
          PYSTAC_STAC_VERSION_OVERRIDE: ${{ matrix.stac_version }}
