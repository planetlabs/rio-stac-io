name: Test


env:
  PIXI_LOCKED: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.52.0 # Pin to a specific version for stability
        with:
          cache: true # Enable caching of the Pixi environment
      - uses: actions/checkout@v5
      - run: pixi run -e lint lint

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        gdal: [gdal38, gdal39, gdal310, gdal311]
        stac_version: ["1.0.0", "1.1.0"]
    steps:
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.52.0 # Pin to a specific version for stability
        with:
          cache: true # Enable caching of the Pixi environment
      - run: apt-get update && apt-get install -y build-essential
      - uses: actions/checkout@v5
      - run: pixi run -e dev-${{ matrix.gdal }} test
        env:
          PYSTAC_STAC_VERSION_OVERRIDE: ${{ matrix.stac_version }}
