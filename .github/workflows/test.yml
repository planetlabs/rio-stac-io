name: Test


env:
  PIXI_LOCKED: true
  PIXI_VERSION: 0.52.0

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/prefix-dev/pixi:$PIXI_VERSION
    steps:
      - uses: actions/checkout@v5
      - run: apt-get update && apt-get install -y build-essential git curl jq
      - run: pixi run -e lint lint

  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/prefix-dev/pixi:$PIXI_VERSION
    strategy:
      matrix:
        GDAL: [gdal38, gdal39, gdal310, gdal311]
        PYSTAC_STAC_VERSION_OVERRIDE: ["1.0.0", "1.1.0"]
    steps:
      - uses: actions/checkout@v5
      - run: apt-get update && apt-get install -y build-essential git curl jq
      - run: pixi run -e dev-$GDAL test
