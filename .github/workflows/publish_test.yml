name: Publish to Test PyPi

env:
  PIXI_LOCKED: true

on:
  push:
    tags:
      - '*'

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
      TWINE_REPOSITORY_URL: "https://test.pypi.org/simple/"
    steps:
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.52.0 # Pin to a specific version for stability
        with:
          cache: true # Enable caching of the Pixi environment
      - uses: actions/checkout@v5
      - run: pixi run -e build deploy
